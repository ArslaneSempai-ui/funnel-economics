<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where the funnel leaks, and what it is worth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfaf7'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='7' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
  </div>
<p class="renvoi" style="margin-bottom:1.5rem">
This runs entirely in your browser — no server, nothing leaves your machine. The funnel is
<b>synthetic and seeded</b>. <b>Change what a fix costs, under "the ranking is not in the
funnel", and watch the priority order invert</b> while the table above it does not move a
pixel. <a href="https://github.com/ArslaneSempai-ui/funnel-economics">Source and method</a>.
</p>

  <div class="chiffres" id="entonnoir"></div>
  <div id="verdict"></div>

  <h2 id="titreValeur"></h2>
  <div id="valeur"></div>

  <h2 id="titreLeviers"></h2>
  <div id="leviers"></div>

  <h2 id="titreHyp"></h2>
  <div id="hypotheses"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script>window.LOCAL_PRET = new Promise((r) => { window.LOCAL_POSE = r; });</script>
<script type="module">
import { generate, SCENARIO } from "./js/population.js";
import { measure, worstStep, endToEnd } from "./js/funnel.js";
import { priceAll, LEVERS, SCENARIOS } from "./js/value.js";
import { ASSUMPTIONS, BOUNDS } from "./js/assumptions.js";

const users = generate();
let assumptions = { ...ASSUMPTIONS };
let levers = structuredClone(LEVERS);
let scenario = "depart";

const LEVER_BOUNDS = { cost: [1000, 5000000], ceiling: [0.001, 0.40] };

const etat = () => {
  const rates = measure(users);
  const priced = priceAll(SCENARIO, assumptions, levers);
  return {
    rates,
    endToEnd: endToEnd(users),
    worst: worstStep(rates),
    priced: priced.map((p, i) => ({ ...p, valeurRang: i + 1 })),
    /*
     * Trois champs que ce shim ne renvoyait pas.
     *
     * Sans eux, l'écran publié rendait une section entièrement vide — celle qui porte la
     * trouvaille de l'outil, et que la bannière invite le lecteur à manipuler. Le serveur
     * local les fournissait, la démo non, et rien ne comparait les deux : c'est exactement
     * la dérive que ce fichier est censé rendre impossible, arrivée dans le fichier
     * lui-même.
     */
    ordreDepart: priceAll(SCENARIO, assumptions, LEVERS).map((p) => p.step),
    scenarios: SCENARIOS.map((s2) => ({ id: s2.id, actif: s2.id === scenario })),
    classements: SCENARIOS.map((s2) => ({
      id: s2.id,
      rangs: priceAll(SCENARIO, assumptions, { ...LEVERS, ...s2.levers })
        .map((p, i) => ({ etape: p.step, rang: i + 1, parDollar: p.perDollar })),
    })),
    levers, assumptions, bounds: BOUNDS,
  };
};

window.LOCAL = async (chemin, corps) => {
  if (chemin === "/api/etat") return etat();

  if (chemin === "/api/hypotheses") {
    if (corps.remise) assumptions = { ...ASSUMPTIONS };
    else for (const [cle, [min, max]] of Object.entries(BOUNDS)) {
      const v = corps[cle];
      if (typeof v === "number" && Number.isFinite(v)) {
        assumptions = { ...assumptions, [cle]: Math.min(max, Math.max(min, v)) };
      }
    }
    return etat();
  }

  if (chemin === "/api/leviers") {
    if (corps.remise) { levers = structuredClone(LEVERS); scenario = "depart"; }
    else if (typeof corps.scenario === "string") {
      const sc = SCENARIOS.find((x) => x.id === corps.scenario);
      if (sc) { levers = { ...structuredClone(LEVERS), ...structuredClone(sc.levers) }; scenario = sc.id; }
    }
    else {
      const { step, champ, valeur } = corps;
      if (levers[step] && (champ === "cost" || champ === "ceiling") && Number.isFinite(valeur)) {
        const [min, max] = LEVER_BOUNDS[champ];
        levers = { ...levers, [step]: { ...levers[step], [champ]: Math.min(max, Math.max(min, valeur)) } };
      }
    }
    return etat();
  }
  return {};
};

/* Le shim est en place : l'écran peut partir. La balise classique qui a créé la promesse
 * s'exécute avant tout module, donc personne ne peut la manquer. */
window.LOCAL_POSE && window.LOCAL_POSE();
</script>
<script type="module">
import { barres, rangs, choisir, brancher } from "./graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/*
 * One screen, two hosts.
 *
 * Run locally, this talks to the Node server. Published to GitHub Pages there is no server,
 * so the same model runs in the browser and `window.LOCAL` answers the same routes with the
 * same shapes. One file rather than two means the hosted demo cannot drift from the tool.
 */
/*
 * Attendre que le shim soit posé, quand il y en a un.
 *
 * Sur l'hôte statique, le shim est un module qui importe six fichiers ; l'écran n'en
 * importe qu'un. Si un seul de ces six tarde ou échoue, l'écran part avant lui, `api()`
 * tombe sur `fetch("/api/...")`, GitHub répond sa page 404 en HTML, et le lecteur reçoit
 * « Unexpected token '<' » avec un écran vide. Vu une fois sur cinq chargements de la
 * démo du banc, donc invisible pour qui vérifie une seule fois.
 *
 * Une balise classique posée avant les modules crée la promesse ; le shim la tient. En
 * local, `window.LOCAL_PRET` n'existe pas et rien n'attend.
 */
const pret = async () => { if (!window.LOCAL && window.LOCAL_PRET) await window.LOCAL_PRET; };

const api = async (chemin, corps) => {
  await pret();
  return window.LOCAL ? window.LOCAL(chemin, corps)
    : (await fetch(chemin, corps
        ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {})).json();
};

/*
 * Both languages.
 *
 * The engine builds no sentences: it returns structures and the screen phrases them. A
 * sentence built server-side exists in exactly one language, which is an architecture
 * defect rather than a missing translation.
 */
const T = {
    h1: "Where the funnel leaks, and what that is worth",
    lede: "A funnel chart cannot tell you what to fix: it carries neither the costs nor the downstream volumes. This screen adds both.",

    releve: "The funnel, measured",
    colEtape: "step", colEntres: "entered", colConvertis: "converted", colTaux: "rate",
    colIntervalle: "95 % interval", colPrecision: "± points",
    boutEnBout: "end to end",

    pireTitre: "The weakest step",
    pireIdentifiable: (e, t) => `<b>${e}</b> at ${t}. No other step's interval reaches it, so the ranking holds.`,
    pireAmbigu: (e, t, autres) => `<b>${e}</b> at ${t} — but ${autres} overlap${autres.includes(",") ? "" : "s"} its interval. <b>This sample cannot say which is worse</b>, and the tool refuses to.`,

    titreValeur: "What each fix is worth",
    valeurQuoi: "Priced by <b>re-running the funnel</b> with the improvement applied, not by multiplying rates on a page.",
    figEntonnoirTitre: "What is left, step after step",
    figEntonnoirAria: "Descending bars of the number of people still present: most of the fall is spent on the very first step.",
    figTauxTitre: "Each step's rate, and its margin of error",
    figTauxAria: "Bars of the conversion rate per step, each carrying its confidence interval; two intervals that overlap cannot be ranked.",
    tropPeu: "too few observations",
    versEtape: (de, a) => `${de} → ${a}`,
    colPoints: "points", colClients: "extra customers/yr", colRevenu: "extra revenue",
    colCout: "cost", colParEuro: "per $", colRangGraphe: "chart rank",

    voirChiffres: "Show every figure",
    titreLeviers: "The ranking is not in the funnel",
    leviersQuoi: "Each lever has a cost and a ceiling — the two numbers nobody writes down.",
    colLevier: "lever", colCoutLevier: "cost to fix", colPlafond: "points available",
    ordreAvant: "current order",
    remise: "Reset the levers",

    suiteEntonnoir: "A chart stops here: it shows rates, never what a fix costs nor what it returns.",
    suiteValeur: (best, worst, x) => `<b>The best and worst places to spend differ by a factor of ${x}</b> — ${best}× against ${worst}×. None of that is on the chart: no costs, no downstream volumes. <em>And the ranking does not even belong to the funnel. Try it below.</em>`,
    ordreDepart: "starting order", ordreMaintenant: "order now",
    suiteChange: "<b>The order just changed.</b> Not one figure in the funnel moved — not a rate, not an interval, not a bar. Only a belief about what a fix costs. <em>The ranking was never in the funnel: it is in the levers, and the levers are the part nobody writes down.</em>",
    suitePasChange: "The order has not moved yet. Try \"the page is tapped out\" — it is the most ordinary situation of the four and it is enough to invert everything.",
    reglageFin: "Set the levers by hand",
    sc: {
      depart: "The starting levers",
      pageEpuisee: "The landing page has been rebuilt twice",
      onboardingFacile: "Onboarding is a known piece of work",
      retentionUrgente: "Retention is the board's priority",
    },
    scCourt: {
      depart: "as it stands", pageEpuisee: "landing page spent",
      onboardingFacile: "onboarding easy", retentionUrgente: "retention urgent",
    },
    scEnCours: "chosen",
    scPhrase: (phrase) => `Reading the column for: <b>${phrase}</b>. Take another column to price the levers differently.`,
    figRangsTitre: "Where each lever ranks, scenario by scenario",
    figRangsAria: "Four rank trajectories, one per lever, followed across four scenarios. "
      + "The ranking changes from one scenario to the next.",
    rangCourt: (r) => r === 1 ? "1st" : r === 2 ? "2nd" : r === 3 ? "3rd" : r + "th",
    rangsSuite: (levier, de, a) => `One lever changes price and the order of priorities inverts: `
      + `<b>${levier} falls from ${de} to ${a}</b>. The ranking does not live in the funnel, `
      + `it lives in what the levers cost — which nobody writes down.`,
    rangsStable: "The ranking holds across all four scenarios: the order of priorities does not "
      + "depend on those beliefs.",
    rangsReserve: "A rank has no scale. Two levers a hair apart read as first and second — "
      + "the value is on each point, on hover.",
    scq: {
      depart: "back to the point of comparison",
      pageEpuisee: "signup: $90,000 for 1 point rather than $40,000 for 4",
      onboardingFacile: "activate: $40,000 rather than $120,000",
      retentionUrgente: "retain: budget doubled, ceiling doubled",
    },
    titreHyp: "The assumptions",
    hypQuoi: "All of it is arguable, and all of it is editable.",
    annualRevenuePerCustomer: "Annual revenue per customer ($)",
    costPerPaidVisit: "Cost of one paid visit ($)",
    monthsToShip: "Months to ship a fix",
    defaut: "Reset the assumptions",

    provenance: "Every figure on this page is <b>measured</b> by running the model, <b>assumed</b> because nobody here can know it, or <b>chosen</b> by me. None is retrieved from a public source: conversion benchmarks are published by the companies selling the thing being benchmarked. The README says which is which, one by one.",
};

const t = () => T;
let etat = null, occupe = false;

const nb = (n) => Math.round(n).toLocaleString("en-GB");
const dollars = (n) => "$" + nb(n);
const pc = (x) => (x * 100).toFixed(1) + " %";

/*
 * A number typed by a human, read tolerantly.
 *
 * `<input type="number">` renders its value through the browser's locale, so 2.4 appeared
 * as "2,4" on an English page — a visible inconsistency on a screen whose whole argument
 * is that the figures are trustworthy. These are text fields now, and both separators are
 * accepted because both are what people type.
 */
const lire = (v) => Number(String(v).replace(/\s/g, "").replace(",", "."));

function blocEntonnoir() {
  const L = t();
  const lignes = etat.rates.map((r) => `<tr>
    <td>${esc(r.step)}</td><td>${nb(r.entered)}</td><td>${nb(r.converted)}</td>
    <td>${pc(r.rate)}</td><td>[${pc(r.low)} – ${pc(r.high)}]</td>
    <td>${r.precision.toFixed(1)}</td></tr>`).join("");

  const e = etat.endToEnd, w = etat.worst;

  /* Les survivants en valeur absolue. Les dernières barres sont minuscules, et c'est le
   * résultat : quatre-vingt-deux pour cent du monde est parti à la première étape. */
  const figEntonnoir = barres({
    items: [
      { nom: etat.rates[0].from, valeur: etat.rates[0].entered },
      /* Pas d'anneau « vous êtes ici » sur la dernière : à 1,7 % du départ la barre fait
       * trois pixels, et le liseré la transforme en pastille qu'on ne lit plus. */
      ...etat.rates.map((r, i) => ({
        nom: r.step, valeur: r.converted,
        ton: i === etat.rates.length - 1 ? "accent" : undefined,
      })),
    ],
    fmt: nb, aria: L.figEntonnoirAria,
  });

  /* Les intervalles sont dessinés parce qu'ils portent la conclusion : l'étape la plus
   * faible n'est désignable que si son intervalle ne recouvre celui d'aucune autre. */
  const figTaux = barres({
    items: etat.rates.map((r) => ({
      nom: L.versEtape(r.from, r.step), valeur: r.rate, bas: r.low, haut: r.high,
      ici: r.step === w.worst.step,
      ton: r.step === w.worst.step ? (w.identifiable ? "alerte" : "attention") : undefined,
      note: r.reportable ? undefined : L.tropPeu,
    })),
    /* L'échelle va jusqu'à cent pour cent. La caler sur le taux le plus fort ferait passer
     * 75,9 % pour un plein, et l'écart entre les étapes s'en trouverait exagéré — la même
     * tromperie qu'un axe tronqué. */
    fmt: pc, max: 1, aria: L.figTauxAria,
  });

  $("#entonnoir").innerHTML = `<section class="feuillet">
    <div class="titre">${esc(L.releve)}</div>
    <div class="titre-fig">${esc(L.figEntonnoirTitre)}</div>${figEntonnoir}
    <div class="titre-fig">${esc(L.figTauxTitre)}</div>${figTaux}
    <details><summary>${esc(L.voirChiffres)}</summary>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colEtape)}</th><th>${esc(L.colEntres)}</th><th>${esc(L.colConvertis)}</th>
      <th>${esc(L.colTaux)}</th><th>${esc(L.colIntervalle)}</th><th>${esc(L.colPrecision)}</th>
    </tr></thead><tbody>${lignes}</tbody></table></div></details>
    <div class="ligne total">
      <span class="intitule">${esc(L.boutEnBout)}</span>
      <span class="valeur">${nb(e.retained)} / ${nb(e.entered)} — ${pc(e.rate)}</span>
    </div>
  </section>`;
  /* Les bornes de l'intervalle sont dessinées mais écrites nulle part : le survol est le
   * seul endroit où on peut les lire, et c'est d'elles que dépend le classement. */
  brancher($("#entonnoir"));
}

function blocVerdict() {
  const L = t();
  const w = etat.worst;
  const autres = w.tied.map((x) => x.step).join(", ");
  $("#verdict").innerHTML = `<div class="renvoi ${w.identifiable ? "" : "attention"}">
    <b>${esc(L.pireTitre)}.</b> ${w.identifiable
      ? L.pireIdentifiable(esc(w.worst.step), pc(w.worst.rate))
      : L.pireAmbigu(esc(w.worst.step), pc(w.worst.rate), esc(autres))}
  </div>
  <div class="suite">${L.suiteEntonnoir}</div>`;
}

function blocValeur() {
  const L = t();
  $("#titreValeur").textContent = L.titreValeur;

  /*
   * Bars, not columns.
   *
   * The finding is a fifteen-fold gap between the best and worst place to spend. Rendered
   * as a column of numbers it has to be read and subtracted; rendered as bars it is
   * visible before anybody reads anything, and the gap is the whole point of the tool.
   *
   * The table underneath keeps every figure for whoever wants to check the arithmetic —
   * the bar answers "which", the table answers "how do you know".
   */
  const max = Math.max(...etat.priced.map((p) => p.perDollar));
  const jauges = etat.priced.map((p, i) => `<div class="jauge${i === 0 ? " gagnant" : ""}">
    <div class="etiquette">
      <b>${esc(p.step)} <small>— ${esc(etat.levers[p.step].what)}</small></b>
      <span class="valeur">${p.perDollar.toFixed(2)}×</span>
    </div>
    <div class="piste"><div class="remplissage" style="width:${Math.max(2, (p.perDollar / max) * 100).toFixed(1)}%"></div></div>
  </div>`).join("");

  const lignes = etat.priced.map((p, i) => `<tr${i === 0 ? ' class="ici"' : ""}>
    <td>${esc(p.step)}</td><td>+${(p.points * 100).toFixed(0)}</td>
    <td>${nb(p.extraRetained)}</td><td>${dollars(p.extraRevenue)}</td>
    <td>${dollars(p.cost)}</td><td><b>${p.perDollar.toFixed(2)}×</b></td>
    <td>${p.leakRank}</td></tr>`).join("");

  const best = etat.priced[0], worst = etat.priced[etat.priced.length - 1];

  $("#valeur").innerHTML = `<div class="feuillet"><div class="corps">
    <div class="quoi">${L.valeurQuoi}</div>
    ${jauges}
    <details>
      <summary>${esc(L.voirChiffres)}</summary>
      <div class="defile"><table><thead><tr>
        <th>${esc(L.colEtape)}</th><th>${esc(L.colPoints)}</th><th>${esc(L.colClients)}</th>
        <th>${esc(L.colRevenu)}</th><th>${esc(L.colCout)}</th><th>${esc(L.colParEuro)}</th>
        <th>${esc(L.colRangGraphe)}</th></tr></thead><tbody>${lignes}</tbody></table></div>
    </details>
    <div class="suite">${L.suiteValeur(best.perDollar.toFixed(1), worst.perDollar.toFixed(1),
      (best.perDollar / worst.perDollar).toFixed(0))}</div>
  </div></div>`;
}

function blocLeviers() {
  const L = t();
  $("#titreLeviers").textContent = L.titreLeviers;

  /*
   * Les situations nommées plutôt que des champs vides — et posées sur la figure.
   *
   * La trouvaille est que le classement bouge quand une croyance sur un levier bouge. Une
   * interface qui demande de taper deux nombres avant que rien n'arrive ne le démontre
   * pas : elle demande de croire, puis de saisir. Chaque scénario est une phrase qu'on dit
   * vraiment en réunion — et c'est *une colonne de la figure*, puisque la figure les montre
   * déjà toutes les quatre. Les boutons dessous répétaient les colonnes ; ils sont partis.
   */
  const champs = etat.priced.map((p) => {
    const l = etat.levers[p.step];
    return `<div>
      <label for="cost-${p.step}">${esc(p.step)} — ${esc(L.colCoutLevier)}</label>
      <input type="text" inputmode="decimal" id="cost-${p.step}" data-step="${p.step}" data-champ="cost"
        value="${Math.round(l.cost)}" />
      <label for="ceil-${p.step}" style="margin-top:8px">${esc(L.colPlafond)}</label>
      <input type="text" inputmode="decimal" id="ceil-${p.step}" data-step="${p.step}" data-champ="ceiling"
        value="${(l.ceiling * 100).toFixed(1)}" />
    </div>`;
  }).join("");

  const ordre = (xs) => xs.map((x) => esc(x)).join(" → ");
  const change = etat.ordreDepart.join() !== etat.priced.map((p) => p.step).join();

  /*
   * Les quatre scénarios d'un coup.
   *
   * Les boutons en dessous font toujours leur travail — ils changent le tableau et les
   * montants. Mais la trouvaille n'est dans aucun des quatre états : elle est dans le
   * passage de l'un à l'autre, et un lecteur à qui l'on demande de cliquer quatre fois et
   * de se souvenir conclura du premier. La figure porte donc ce que les boutons ne
   * peuvent pas porter, et les boutons gardent ce que la figure ne dit pas : les montants.
   */
  /*
   * L'ordre de départ, pas le classement courant.
   *
   * Les séries étaient construites depuis `etat.priced`, qui se réordonne quand on change
   * de scénario. À égalité d'amplitude — signup et subscribe bougent tous deux de deux
   * rangs — c'était l'ordre de la liste qui départageait, donc la ligne mise en avant
   * sautait d'un levier à l'autre selon le bouton actif. La figure montre les mêmes
   * données dans les quatre cas : elle doit se dessiner à l'identique.
   */
  const etapes = etat.ordreDepart;
  const actif = etat.scenarios.find((sc) => sc.actif)?.id;
  const figRangs = rangs({
    colonnes: etat.classements.map((c) => ({ titre: L.scCourt[c.id] ?? c.id, id: c.id, ici: c.id === actif })),
    choix: true, iciTexte: L.scEnCours,
    series: etapes.map((etape) => ({
      nom: etape,
      rangs: etat.classements.map((c) => {
        const r = c.rangs.find((x) => x.etape === etape);
        return { rang: r?.rang ?? 0, valeur: r?.parDollar };
      }),
    })),
    fmt: (v) => `${v.toFixed(1)}× ${L.colParEuro}`,
    nomRang: L.rangCourt,
    aria: L.figRangsAria,
  });

  /* La phrase sous la figure nomme le levier qui bouge, sans le choisir à la main : c'est
   * celui dont l'écart de rang est le plus grand. S'il n'y en a pas, la figure dit que
   * rien ne bouge, et c'est un résultat aussi. */
  const parcours = etapes.map((etape) => {
    const rs = etat.classements.map((c) => c.rangs.find((x) => x.etape === etape)?.rang ?? 0);
    return { etape, min: Math.min(...rs), max: Math.max(...rs) };
  });
  const bouge = parcours.slice().sort((a, b) => (b.max - b.min) - (a.max - a.min))[0];
  const suiteRangs = bouge && bouge.max > bouge.min
    ? L.rangsSuite(esc(bouge.etape), L.rangCourt(bouge.min), L.rangCourt(bouge.max))
    : L.rangsStable;

  $("#leviers").innerHTML = `<div class="feuillet"><div class="corps">
    <div class="quoi">${L.leviersQuoi}</div>

    <div class="titre-fig">${esc(L.figRangsTitre)}</div>${figRangs}
    <div class="suite">${suiteRangs} <em>${esc(L.rangsReserve)}</em></div>
    <div class="renvoi">${L.scPhrase(esc(L.sc[actif] ?? actif))}</div>

    <div class="avant-apres">
      <div><div class="quand">${esc(L.ordreDepart)}</div>
        <div class="ordre">${ordre(etat.ordreDepart)}</div></div>
      <div class="${change ? "change" : ""}"><div class="quand">${esc(L.ordreMaintenant)}</div>
        <div class="ordre">${ordre(etat.priced.map((p) => p.step))}</div></div>
    </div>

    <div class="suite">${change ? L.suiteChange : L.suitePasChange}</div>

    <details style="margin-top:18px">
      <summary class="quoi" style="cursor:pointer">${esc(L.reglageFin)}</summary>
      <div class="grille" style="margin-top:12px">${champs}</div>
    </details>
  </div></div>`;

  choisir($("#leviers"), (id) => envoyer("/api/leviers", { scenario: id }), actif);
  for (const input of document.querySelectorAll("#leviers input")) {
    input.onchange = (e) => {
      const el = e.target;
      const brut = lire(el.value);
      const valeur = el.dataset.champ === "ceiling" ? brut / 100 : brut;
      envoyer("/api/leviers", { step: el.dataset.step, champ: el.dataset.champ, valeur });
    };
  }
}

function blocHypotheses() {
  const L = t();
  $("#titreHyp").textContent = L.titreHyp;
  const champs = Object.keys(etat.bounds).map((cle) => {
    const [min, max] = etat.bounds[cle];
    return `<div><label for="${cle}">${esc(L[cle])}</label>
      <input type="text" inputmode="decimal" id="${cle}" value="${etat.assumptions[cle]}"
        data-min="${min}" data-max="${max}" /></div>`;
  }).join("");

  $("#hypotheses").innerHTML = `<div class="feuillet"><div class="corps">
    <div class="quoi">${esc(L.hypQuoi)}</div>
    <div class="grille">${champs}</div>
    <button class="b remise" id="defaut" type="button">${esc(L.defaut)}</button>
  </div></div>`;

  for (const cle of Object.keys(etat.bounds)) {
    $(`#${cle}`).onchange = (e) => envoyer("/api/hypotheses", { [cle]: lire(e.target.value) });
  }
  $("#defaut").onclick = () => envoyer("/api/hypotheses", { remise: true });
}

function dessiner() {
  const L = t();
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#provenanceLegende").innerHTML = L.provenance;
  blocEntonnoir(); blocVerdict(); blocValeur(); blocLeviers(); blocHypotheses();
}

/* Passer la main sur les colonnes enchaîne les scénarios : on garde le dernier appel
 * demandé plutôt que de le jeter, sinon l'écran reste en arrière de la main. */
let enAttente = null;
async function envoyer(chemin, corps) {
  if (occupe) { enAttente = [chemin, corps]; return; }
  occupe = true;
  try { etat = await api(chemin, corps ?? {}); dessiner(); }
  finally {
    occupe = false;
    if (enAttente) { const suite = enAttente; enAttente = null; envoyer(...suite); }
  }
}

etat = await api("/api/etat");
dessiner();
</script>
